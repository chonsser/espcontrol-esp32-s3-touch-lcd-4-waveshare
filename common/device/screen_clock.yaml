# =============================================================================
# CLOCK SCREENSAVER - Full-screen clock overlay for idle display
# =============================================================================
# Black overlay with a large configurable time label (legacy Thin by default).
# Hidden by default; shown
# by backlight.yaml when the clock screensaver is enabled and the idle
# timeout fires. The label is positioned absolutely so the interval can
# drift it for burn-in prevention.
# =============================================================================

font:
  - file: &clock_thin_source "gfonts://Roboto@Thin"
    id: font_number_clock
    size: ${clock_font_size}
    bpp: 4
    glyphs: " 0123456789:./-"

  # Pinned static Google Fonts builds; fetched by ESPHome at build time only.
  # URLs work for builds/, device wrappers and remotely included packages alike.
  # Exact source copies for reproducible metric tests, provenance and matching
  # copyright/OFL notices live in common/assets/fonts/.
  - file: &clock_bold_source "https://fonts.gstatic.com/s/roboto/v51/KFOMCnqEu92Fr1ME7kSn66aGLdTylUAMQXC89YmC2DPNWuYjammT.ttf"
    id: font_number_clock_bold
    size: ${clock_font_size}
    bpp: 4
    glyphs: " 0123456789:./-"

  - file: &clock_mono_source "https://fonts.gstatic.com/s/robotomono/v31/L0xuDF4xlVMF-BfR8bXMIhJHg45mwgGEFl0_3vqPQw.ttf"
    id: font_number_clock_mono
    size: ${clock_font_size}
    bpp: 4
    glyphs: " 0123456789:./-"

  # Compiled, bounded size pool; no runtime bitmap scaling or font transfer.
  - file: *clock_thin_source
    id: font_number_clock_24
    size: 24
    bpp: 4
    glyphs: " 0123456789:./-"
  - file: *clock_thin_source
    id: font_number_clock_40
    size: 40
    bpp: 4
    glyphs: " 0123456789:./-"
  - file: *clock_thin_source
    id: font_number_clock_64
    size: 64
    bpp: 4
    glyphs: " 0123456789:./-"
  - file: *clock_thin_source
    id: font_number_clock_96
    size: 96
    bpp: 4
    glyphs: " 0123456789:./-"
  - file: *clock_thin_source
    id: font_number_clock_128
    size: 128
    bpp: 4
    glyphs: " 0123456789:./-"
  - file: *clock_bold_source
    id: font_number_clock_bold_24
    size: 24
    bpp: 4
    glyphs: " 0123456789:./-"
  - file: *clock_bold_source
    id: font_number_clock_bold_40
    size: 40
    bpp: 4
    glyphs: " 0123456789:./-"
  - file: *clock_bold_source
    id: font_number_clock_bold_64
    size: 64
    bpp: 4
    glyphs: " 0123456789:./-"
  - file: *clock_bold_source
    id: font_number_clock_bold_96
    size: 96
    bpp: 4
    glyphs: " 0123456789:./-"
  - file: *clock_bold_source
    id: font_number_clock_bold_128
    size: 128
    bpp: 4
    glyphs: " 0123456789:./-"
  - file: *clock_mono_source
    id: font_number_clock_mono_24
    size: 24
    bpp: 4
    glyphs: " 0123456789:./-"
  - file: *clock_mono_source
    id: font_number_clock_mono_40
    size: 40
    bpp: 4
    glyphs: " 0123456789:./-"
  - file: *clock_mono_source
    id: font_number_clock_mono_64
    size: 64
    bpp: 4
    glyphs: " 0123456789:./-"
  - file: *clock_mono_source
    id: font_number_clock_mono_96
    size: 96
    bpp: 4
    glyphs: " 0123456789:./-"
  - file: *clock_mono_source
    id: font_number_clock_mono_128
    size: 128
    bpp: 4
    glyphs: " 0123456789:./-"

lvgl:
  top_layer:
    widgets:
      - obj:
          id: clock_screensaver
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0x000000
          bg_opa: 100%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
          widgets:
            - label:
                id: clock_label
                text_font: font_number_clock
                text_color: 0xFFFFFF
                text: "00:00"
                text_align: CENTER
                pad_all: 0
            - label:
                id: clock_date_label
                text_font: font_number_clock_40
                text_color: 0xFFFFFF
                text: ""
                text_align: CENTER
                pad_all: 0
                hidden: true
      - obj:
          id: dim_screensaver_touch_guard
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_opa: 0%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
          on_press:
            then:
              - script.execute: screensaver_wake
      - obj:
          id: screensaver_wake_touch_guard
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_opa: 0%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
