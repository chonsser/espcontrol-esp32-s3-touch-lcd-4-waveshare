# =============================================================================
# DEVICE - Waveshare ESP32-S3-Touch-LCD-4 hardware definition (board rev 4.0)
# =============================================================================
# Pin assignments, peripherals, and platform config for the 4" square panel.
# Includes the ESP32-S3 SoC (native WiFi), ST7701S RGB display, GT911
# capacitive touchscreen, and the CH32V003 IO expander that owns the LCD/touch
# resets, buzzer, and backlight PWM.
#
# Board revisions 1.0-3.0 use a TCA9554 expander on a different I2C bus and are
# not covered by this profile.
# =============================================================================

substitutions:
  espcontrol_component_url: "https://github.com/jtenniswood/espcontrol"
  espcontrol_component_ref: "main"
  mdi_font_file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"

# ---------------------------------------------------------------------------
# ESP32-S3 platform (16MB flash, ESP-IDF framework)
# ---------------------------------------------------------------------------
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    # stick to recommended version, currently 5.5.4, 55.03.39 with tool-esptoolpy 5.3.0. No issues
    #version: 5.5.2
    # pioarduino 55.03.38-1 pulls tool-esptoolpy 5.2.0, which can install
    # incompletely in ESPHome containers and then fail while creating .bin files.
    #platform_version: 55.03.37
    advanced:
      # The clock/cover-art display controller uses a deep ESPHome action chain.
      # Keep enough headroom for rapid presence-driven sleep/wake transitions;
      # the 8 KiB default can overflow loopTask on this profile.
      loop_task_stack_size: 16384
    sdkconfig_options:
      # The S3 display stack leaves little internal RAM for HTTPS OTA checks.
      # Allocate mbedTLS buffers from PSRAM so firmware downloads can connect.
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      # Keep the ESP32 task watchdog long enough for display startup while
      # remaining compatible with ESPHome 2026.4 and newer.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
      # Keep WiFi startup inside the internal-RAM budget after the RGB display
      # and LVGL buffers are initialized.
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "8"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      # Route ordinary allocations larger than 4 KiB to PSRAM while keeping
      # a 32 KiB internal reserve for DMA and cache-disabled operations.
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "32768"
      # RGB bounce-buffer scan-out requires 64-byte data-cache lines. The
      # default 32-byte lines can desynchronise PSRAM reads from panel DMA and
      # leave the whole display vertically shifted until the next restart.
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      # The RGB driver already restarts after a genuine DMA underflow. Restarting
      # on every VSYNC can instead shift the framebuffer by one bounce-buffer block.
      CONFIG_LCD_RGB_RESTART_IN_VSYNC: "n"
      CONFIG_LCD_RGB_ISR_IRAM_SAFE: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

# ---------------------------------------------------------------------------
# External component
# ---------------------------------------------------------------------------
external_components:
  - source:
      type: git
      url: ${espcontrol_component_url}
      ref: ${espcontrol_component_ref}
      path: components
    components: [espcontrol, web_server_idf, artwork_image, mipi_rgb]
    refresh: 1s

espcontrol:
  id: espcontrol_app
  panel_config:
    device_profile: ${device_slug}
    storage: card_images
    button_order: button_order
    button_on_color: button_on_color
    buttons:
      - config: button_1_config
        subpage_chunks: [subpage_1_config, subpage_1_config_ext, subpage_1_config_ext_2, subpage_1_config_ext_3]
      - config: button_2_config
        subpage_chunks: [subpage_2_config, subpage_2_config_ext, subpage_2_config_ext_2, subpage_2_config_ext_3]
      - config: button_3_config
        subpage_chunks: [subpage_3_config, subpage_3_config_ext, subpage_3_config_ext_2, subpage_3_config_ext_3]
      - config: button_4_config
        subpage_chunks: [subpage_4_config, subpage_4_config_ext, subpage_4_config_ext_2, subpage_4_config_ext_3]
      - config: button_5_config
        subpage_chunks: [subpage_5_config, subpage_5_config_ext, subpage_5_config_ext_2, subpage_5_config_ext_3]
      - config: button_6_config
        subpage_chunks: [subpage_6_config, subpage_6_config_ext, subpage_6_config_ext_2, subpage_6_config_ext_3]
      - config: button_7_config
        subpage_chunks: [subpage_7_config, subpage_7_config_ext, subpage_7_config_ext_2, subpage_7_config_ext_3]
      - config: button_8_config
        subpage_chunks: [subpage_8_config, subpage_8_config_ext, subpage_8_config_ext_2, subpage_8_config_ext_3]
      - config: button_9_config
        subpage_chunks: [subpage_9_config, subpage_9_config_ext, subpage_9_config_ext_2, subpage_9_config_ext_3]
# ---------------------------------------------------------------------------
# ESPHome core (device name from substitutions)
# ---------------------------------------------------------------------------
# ESP32-S3 with octal PSRAM and MIPI RGB display fails to reinitialize
# peripherals after a software reset. A brief deep sleep forces a full
# hardware reset on wake, equivalent to a power cycle. The on_boot
# handler catches USB-triggered and software-triggered resets (the
# latter fired by the "Apply Configuration" restart button); the OTA
# on_end hook catches wireless updates.
# ---------------------------------------------------------------------------
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  build_flags:
    - "-DESPCONTROL_MAX_GRID_SLOTS=9"
    - "-DESPCONTROL_LOW_HEAP_MEDIA_CONTROL=1"
    - "-DESPCONTROL_LOW_HEAP_COVER_ART=1"
    - "-DESPCONTROL_DISABLE_WEATHER_FORECAST=1"
    # Keep C++ literals close to their functions on the S3 firmware image;
    # the modal code is large enough to otherwise trip Xtensa l32r range limits.
    - "-mtext-section-literals"
    # This panel scans out at about 38 Hz, so the stock tap feedback (wait for
    # Home Assistant, then a three-frame fade) looks like a blink. Flip toggle
    # cards as soon as the action is sent and fade the colour over 200 ms.
    - "-DESPCONTROL_OPTIMISTIC_TOGGLE=1"
    - "-DESPCONTROL_TOGGLE_TRANSITION_MS=200"
  on_boot:
    # The ESPHome expander driver starts with every EXIO pin driven high, which
    # turns the buzzer on. Silence it before anything else can delay startup
    # (the reset workaround below deep-sleeps with the expander still powered),
    # and release the two open-drain inputs so the expander never fights them:
    # EXIO0 is the battery charger's STAT output and EXIO7 is RTC_INT.
    - priority: 850
      then:
        - lambda: |-
            id(wave_io_hub).digital_write(6, false);
            id(wave_io_hub).pin_mode(0, gpio::FLAG_INPUT);
            id(wave_io_hub).pin_mode(7, gpio::FLAG_INPUT);
        # Reset the GT911 here instead of in the touchscreen driver. The driver
        # probes the controller 56 ms after releasing reset, which is too early
        # on this board after a warm restart: the probe fails, the driver falls
        # back to the unused 0x14 address, and touch stays dead until a power
        # cycle. Holding TP_INT low across the reset selects address 0x5D; then
        # wait until the controller really answers before the driver sets up.
        - lambda: |-
            id(wave_io_hub).digital_write(2, false);
            id(wave_io_hub).digital_write(1, false);
            delay(10);
            id(wave_io_hub).digital_write(1, true);
            delay(100);
            for (int attempt = 0; attempt < 40; attempt++) {
              if (id(bus_a).write(0x5D, nullptr, 0) == i2c::ERROR_OK) break;
              delay(25);
            }
    - priority: 800
      then:
        - lambda: |-
            auto reason = esp_reset_reason();
            if (reason == ESP_RST_SW) {
              esp_ota_img_states_t ota_state;
              const esp_partition_t *running = esp_ota_get_running_partition();
              if (running != nullptr &&
                  esp_ota_get_state_partition(running, &ota_state) == ESP_OK &&
                  ota_state == ESP_OTA_IMG_PENDING_VERIFY) {
                ESP_LOGI("s3_reset", "Marking OTA image valid before hardware-reset workaround");
                id(s3_panel_safe_mode).mark_successful();
                global_preferences->sync();
                esp_sleep_enable_timer_wakeup(100000);
                esp_deep_sleep_start();
                return;
              }
            }
            if (reason == ESP_RST_USB || reason == ESP_RST_SW) {
              esp_sleep_enable_timer_wakeup(100000);
              esp_deep_sleep_start();
            }
    - priority: -100
      then:
        # ESPHome idles 16 ms between loop passes, which stacks on top of the
        # render time and leaves LVGL drawing fewer frames than the panel shows.
        # A short idle lets the 16 ms LVGL refresh timer set the pace instead.
        - lambda: 'App.set_loop_interval(5);'
        - lambda: 'id(screen_rotation_ready) = true;'
        - script.execute: apply_screen_rotation
        - script.execute: clock_bar_apply

# ---------------------------------------------------------------------------
# PSRAM (video frame buffer memory)
# ---------------------------------------------------------------------------
psram:
  mode: octal
  speed: 80MHz

# ---------------------------------------------------------------------------
# OTA updates (ESPHome native + HTTP-based)
# ---------------------------------------------------------------------------
ota:
  - platform: esphome
    on_begin:
      then:
        - script.execute: show_update_writing
        - script.wait: show_update_writing
    on_end:
      then:
        - globals.set:
            id: firmware_update_complete_pending
            value: 'true'
        - lambda: 'global_preferences->sync();'
        - lambda: |-
            esp_sleep_enable_timer_wakeup(100000);
            esp_deep_sleep_start();
    on_error:
      then:
        - script.execute: show_update_failed
  - platform: http_request
    on_begin:
      then:
        - script.execute: show_update_writing
        - script.wait: show_update_writing
    on_end:
      then:
        - globals.set:
            id: firmware_update_complete_pending
            value: 'true'
        - lambda: 'global_preferences->sync();'
        - lambda: |-
            esp_sleep_enable_timer_wakeup(100000);
            esp_deep_sleep_start();
    on_error:
      then:
        - script.execute: show_update_failed

safe_mode:
  id: s3_panel_safe_mode
  boot_is_good_after: 10s

# ---------------------------------------------------------------------------
# Shared infrastructure (API, logging, web server, restart button)
# ---------------------------------------------------------------------------
packages:
  core_infra: !include ../../../common/device/core_infra.yaml

# The S3 panel runs close to the internal RAM limit once the RGB display,
# LVGL, web UI, and API are all active. Keep the native API connection pool
# modest, but allow one spare slot so Home Assistant can reconnect after an
# abrupt OTA reset while the ESPHome dashboard/logger still has a socket open.
# Give the send queue extra headroom so reconnect bursts and compact Home
# Assistant action responses do not drop the API connection on this low-memory
# panel.
api:
  listen_backlog: 4
  max_connections: 3
  max_send_queue: 12

# The Waveshare USB-C port is wired to the ESP32-S3 native USB pins (GPIO19/20),
# and UART0 (GPIO43/44) feeds the RS485 transceiver, so log over USB Serial/JTAG.
logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  use_psram: true

# ---------------------------------------------------------------------------
# Backlight (CH32V003 PWM output + monochromatic light entity)
# ---------------------------------------------------------------------------
output:
  # The backlight PWM comes from the CH32V003 IO expander, not an ESP32 pin.
  # The expander output is RC-filtered into the AP3032 LED driver's feedback
  # node (V4.0 schematic: R40/C27/R36), so a higher duty means a dimmer panel:
  # the output must be inverted. If the panel is dark at 100% and bright at low
  # brightness, this board revision drives the PWM the other way round; flip
  # "inverted" to false.
  - platform: waveshare_io_ch32v003
    waveshare_io_ch32v003_id: wave_io_hub
    id: gpio_backlight_pwm
    inverted: true
    # The feedback injection cuts the LED current off completely above roughly
    # 92% duty, so the lowest ~8% of the brightness range would be black. Lift
    # the floor so 1% is still a visible, dim panel.
    min_power: 0.10
    zero_means_zero: true
    safe_pwm_levels:
      min_value: 0
      max_value: 247

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
    gamma_correct: 1.0
    on_turn_on:
      then:
        - if:
            condition:
              lambda: |-
                auto now = panel_time_or_fallback(id(panel_time).now(), id(homeassistant_time).now());
                return (id(espcontrol_app).display().target_source_is(
                            espcontrol::DisplayRequestSource::SCREEN_SCHEDULE) &&
                        id(espcontrol_app).display().target_mode_is(
                            espcontrol::DisplayMode::DISPLAY_OFF)) ||
                       screen_schedule_waiting_for_time(
                         id(screen_schedule_trigger).state,
                         id(schedule_enabled).state,
                         now.is_valid());
            then:
              - script.execute: backlight_force_display_off
            else:
              - if:
                  condition:
                    lambda: |-
                      return id(espcontrol_app).display().current_mode_is(
                          espcontrol::DisplayMode::DISPLAY_OFF);
                  then:
                    - script.execute: screensaver_wake
    on_turn_off:
      then:
        - script.execute: display_backlight_handle_off
    on_state:
      then:
        - script.execute: display_backlight_handle_state

# ---------------------------------------------------------------------------
# Buzzer (EXIO6). It must be declared and held off: the expander driver starts
# with all pins high, which would otherwise leave the buzzer sounding.
# ---------------------------------------------------------------------------
switch:
  - platform: gpio
    name: Buzzer
    id: board_buzzer
    icon: mdi:volume-high
    entity_category: config
    restore_mode: ALWAYS_OFF
    pin:
      waveshare_io_ch32v003: wave_io_hub
      number: 6
      mode:
        output: true

button:
  - platform: template
    name: Backlight Sweep Test
    internal: true
    disabled_by_default: true
    entity_category: diagnostic
    icon: mdi:brightness-percent
    web_server:
      sorting_group_id: sg_brightness
    on_press:
      then:
        - script.execute: s3_backlight_sweep_test

# ---------------------------------------------------------------------------
# SPI bus (ST7701S init sequence; CS is GPIO42, set by the display model)
# ---------------------------------------------------------------------------
spi:
  - id: lcd_spi
    clk_pin: GPIO2
    mosi_pin: GPIO1

# ---------------------------------------------------------------------------
# I2C bus: CH32V003 IO expander (0x24), GT911 touch (0x5D), PCF85063 RTC (0x51)
# ---------------------------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO15
    scl: GPIO7
    scan: true
    frequency: 400kHz

# CH32V003-based Waveshare IO expander (board rev 4.0).
#   EXIO0 charger STAT   EXIO1 TP_RST   EXIO2 TP_INT   EXIO3 LCD_RST
#   EXIO4 SD_CS   EXIO5 SYS_EN   EXIO6 BEE_EN   EXIO7 RTC_INT
#   plus the backlight PWM and battery ADC.
# The driver starts with every pin high, which keeps SYS_EN (power hold)
# asserted; nothing else may drive EXIO5 low.
waveshare_io_ch32v003:
  - id: wave_io_hub
    address: 0x24
    i2c_id: bus_a

touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: bus_a
    display: my_display
    update_interval: 16ms
    # TP_RST (EXIO1) and TP_INT (EXIO2) sit behind the expander. The reset and
    # address select run from on_boot above, so no pins are declared here and
    # touches are polled.
    transform:
      mirror_x: false
      mirror_y: false
    on_touch:
      - script.execute: cover_art_pause_after_touch
      - script.wait: cover_art_pause_after_touch
      - script.execute: screensaver_wake

# ---------------------------------------------------------------------------
# Display (4" 480x480 ST7701S RGB panel, Waveshare pinout)
# ---------------------------------------------------------------------------
display:
  - platform: mipi_rgb
    model: WAVESHARE-4-480X480
    id: my_display
    # Swap complete RGB framebuffers at frame boundaries to prevent tearing.
    tear_free: true
    # Start WiFi before the RGB panel allocates its frame buffers; otherwise the
    # WiFi driver can fail to claim enough internal RX buffers on fresh boots.
    setup_priority: 240
    reset_pin:
      waveshare_io_ch32v003: wave_io_hub
      number: 3
    pixel_mode: 18bit
    # Keep the S3 RGB clock conservative; higher clocks have caused screen
    # shifts and pixel breakup on the sibling 4848S040 panel when WiFi, flash,
    # and web traffic compete for PSRAM.
    pclk_frequency: 10MHz
    update_interval: never
    auto_clear_enabled: False
    # Panel register values from the Waveshare V4.0 BSP
    # (waveshare/esp32_s3_touch_lcd_4 3.0.0). ESPHome appends these to the
    # model's stock ST7701S sequence, so the vendor values win.
    init_sequence:
      - [0x11]
      - delay 120ms
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xC0, 0x3B, 0x00]
      - [0xC1, 0x0D, 0x02]
      - [0xC2, 0x21, 0x08]
      - [0xCD, 0x08]
      - [0xB0, 0x00, 0x11, 0x18, 0x0E, 0x11, 0x06, 0x07, 0x08, 0x07, 0x22, 0x04, 0x12, 0x0F, 0xAA, 0x31, 0x18]
      - [0xB1, 0x00, 0x11, 0x19, 0x0E, 0x12, 0x07, 0x08, 0x08, 0x08, 0x22, 0x04, 0x11, 0x11, 0xA9, 0x32, 0x18]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x60]
      - [0xB1, 0x30]
      - [0xB2, 0x87]
      - [0xB3, 0x80]
      - [0xB5, 0x49]
      - [0xB7, 0x85]
      - [0xB8, 0x21]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - delay 20ms
      - [0xE0, 0x00, 0x1B, 0x02]
      - [0xE1, 0x08, 0xA0, 0x00, 0x00, 0x07, 0xA0, 0x00, 0x00, 0x00, 0x44, 0x44]
      - [0xE2, 0x11, 0x11, 0x44, 0x44, 0xED, 0xA0, 0x00, 0x00, 0xEC, 0xA0, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x11]
      - [0xE4, 0x44, 0x44]
      - [0xE5, 0x0A, 0xE9, 0xD8, 0xA0, 0x0C, 0xEB, 0xD8, 0xA0, 0x0E, 0xED, 0xD8, 0xA0, 0x10, 0xEF, 0xD8, 0xA0]
      - [0xE6, 0x00, 0x00, 0x11, 0x11]
      - [0xE7, 0x44, 0x44]
      - [0xE8, 0x09, 0xE8, 0xD8, 0xA0, 0x0B, 0xEA, 0xD8, 0xA0, 0x0D, 0xEC, 0xD8, 0xA0, 0x0F, 0xEE, 0xD8, 0xA0]
      - [0xEB, 0x02, 0x00, 0xE4, 0xE4, 0x88, 0x00, 0x40]
      - [0xEC, 0x3C, 0x00]
      - [0xED, 0xAB, 0x89, 0x76, 0x54, 0x02, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x20, 0x45, 0x67, 0x98, 0xBA]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]

# ---------------------------------------------------------------------------
# LVGL base (display binding, must be before any page definitions)
# ---------------------------------------------------------------------------
lvgl:
  id: main_lvgl
  # Keep LVGL after WiFi and after the display driver.
  setup_priority: 230
  # A full-frame buffer avoids splitting page redraws into many small regions.
  # At 90/270 degrees ESPHome rotates each rendered region in software; one
  # full-frame rotation is substantially cheaper than repeatedly rotating the
  # same page in partial chunks on the S3's PSRAM-backed display stack.
  buffer_size: 100%
  displays: my_display
  rotation: 0
  # One color transition may contain several dirty areas/flush chunks even with
  # a 100% LVGL buffer. Present them together, never as intermediate half-frames.
  # ESPHome maps these to LVGL RENDER_START and REFR_READY (not per-chunk events).
  on_draw_start:
    - lambda: id(my_display).begin_frame();
  on_draw_end:
    - lambda: id(my_display).end_frame();
  touchscreens:
    - touchscreen_id: my_touchscreen
      long_press_time: 3s

script:
  - id: s3_backlight_sweep_test
    mode: restart
    then:
      - script.execute: screensaver_wake
      - script.wait: screensaver_wake
      - script.execute:
          id: backlight_note_internal_brightness
          brightness: 1.0
      - light.turn_on:
          id: display_backlight
          brightness: 100%
          transition_length: 0s
      - delay: 3s
      - script.execute:
          id: backlight_note_internal_brightness
          brightness: 0.6
      - light.turn_on:
          id: display_backlight
          brightness: 60%
          transition_length: 0s
      - delay: 3s
      - script.execute:
          id: backlight_note_internal_brightness
          brightness: 0.3
      - light.turn_on:
          id: display_backlight
          brightness: 30%
          transition_length: 0s
      - delay: 3s
      - script.execute:
          id: backlight_note_internal_brightness
          brightness: 0.1
      - light.turn_on:
          id: display_backlight
          brightness: 10%
          transition_length: 0s
      - delay: 3s
      - script.execute:
          id: backlight_note_internal_brightness
          brightness: 1.0
      - light.turn_on:
          id: display_backlight
          brightness: 100%
          transition_length: 0s

  - id: apply_screen_rotation
    then:
      - if:
          condition:
            lambda: 'return id(screen_rotation_select).current_option() == "90";'
          then:
            - lvgl.display.set_rotation: 90
          else:
            - if:
                condition:
                  lambda: 'return id(screen_rotation_select).current_option() == "180";'
                then:
                  - lvgl.display.set_rotation: 180
                else:
                  - if:
                      condition:
                        lambda: 'return id(screen_rotation_select).current_option() == "270";'
                      then:
                        - lvgl.display.set_rotation: 270
                      else:
                        - lvgl.display.set_rotation: 0

select:
  - platform: template
    name: "${entity_screen_rotation}"
    internal: true
    disabled_by_default: true
    id: screen_rotation_select
    entity_category: config
    icon: "mdi:screen-rotation"
    optimistic: true
    restore_value: true
    initial_option: "0"
    options:
      - "0"
      - "90"
      - "180"
      - "270"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(screen_rotation_ready);'
            then:
              - script.execute: apply_screen_rotation
              - script.execute: clock_bar_apply
